<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Post Publisher | Панель публикатора</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg-primary: #0a0d16;
      --bg-secondary: #111625;
      --bg-tertiary: #182032;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-blue: #24A1DE; /* Telegram blue */
      --accent-blue-hover: #1e87bb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --error: #ef4444;
      --font-sans: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Telegram Mock Colors */
      --tg-bg: #0e1621;
      --tg-chat-bg: #17212b;
      --tg-bubble: #182533;
      --tg-text: #f5f5f5;
      --tg-link: #64b5f6;
      --tg-meta: #708499;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 2.2rem;
      height: 2.2rem;
      background: var(--accent-blue);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(36, 161, 222, 0.3);
    }

    .logo-icon svg {
      fill: var(--text-main);
      width: 1.3rem;
      height: 1.3rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(90deg, #ffffff 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.85rem;
      color: var(--accent-blue);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 550px 1fr;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Panels */
    .glass-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(36, 161, 222, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      padding-right: 2.5rem;
    }

    .toggle-visibility-btn {
      position: absolute;
      right: 0.75rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-visibility-btn:hover {
      color: var(--text-main);
    }

    .checkbox-group {
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }

    /* Buttons */
    .btn-publish {
      background-color: #0057B7; /* Ukrainian Blue */
      color: #FFD700;            /* Ukrainian Yellow */
      border: 2px solid #FFD700;
      border-radius: 8px;
      padding: 0.9rem 1.5rem;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 87, 183, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .btn-publish:hover {
      background-color: #FFD700;
      color: #0057B7;
      border-color: #0057B7;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
    }

    .btn-publish:active {
      transform: translateY(0);
    }

    /* Live Preview Section */
    .preview-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 1.5rem;
    }

    .tg-phone-frame {
      flex: 1;
      background-color: var(--tg-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      min-height: 500px;
      background-image: radial-gradient(rgba(24, 37, 51, 0.4) 15%, transparent 16%),
                        radial-gradient(rgba(24, 37, 51, 0.4) 15%, transparent 16%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }

    .tg-chat-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .tg-avatar {
      width: 40px;
      height: 40px;
      background-color: #2b5278;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 1rem;
    }

    .tg-chat-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
    }

    .tg-chat-info p {
      font-size: 0.75rem;
      color: var(--tg-meta);
    }

    .tg-chat-history {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 1rem;
    }

    /* Telegram Bubble */
    .tg-message-bubble {
      background-color: var(--tg-bubble);
      border-radius: 12px 12px 0 12px;
      max-width: 90%;
      align-self: flex-end;
      padding: 0.5rem 0.5rem 0.35rem 0.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 200px;
    }

    .tg-message-image {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      aspect-ratio: 16/9;
      background-color: #111a24;
      background-size: cover;
      background-position: center;
    }

    .tg-message-text {
      color: var(--tg-text);
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0.25rem 0.5rem;
    }

    .tg-message-text strong {
      font-weight: 700;
    }

    .tg-message-text em {
      font-style: italic;
    }

    .tg-message-text a {
      color: var(--tg-link);
      text-decoration: none;
    }

    .tg-message-text a:hover {
      text-decoration: underline;
    }

    .tg-message-text code {
      font-family: var(--font-mono);
      background-color: rgba(0,0,0,0.3);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .tg-message-meta {
      align-self: flex-end;
      font-size: 0.68rem;
      color: var(--tg-meta);
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding-right: 0.25rem;
    }

    .tg-message-meta svg {
      width: 12px;
      height: 12px;
      fill: #40a7e3;
    }

    /* Telegram Inline Keyboard Button */
    .tg-inline-keyboard {
      margin-top: 0.25rem;
      width: 90%;
      align-self: flex-end;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tg-inline-button {
      background-color: rgba(24, 37, 51, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      color: var(--tg-link);
      text-align: center;
      padding: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s;
      cursor: pointer;
      display: none;
    }

    .tg-inline-button:hover {
      background-color: rgba(24, 37, 51, 0.9);
    }

    /* Logging/Status Area */
    .console-panel {
      background-color: #05070c;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    }

    .console-log {
      color: var(--text-muted);
    }

    .console-log.info {
      color: var(--accent-blue);
    }

    .console-log.success {
      color: var(--success);
    }

    .console-log.error {
      color: var(--error);
    }

    /* Header Night Vision Support */
    body.night-vision {
      --bg-primary: #050000;
      --bg-secondary: #0c0000;
      --bg-tertiary: #150000;
      --border-color: rgba(255, 0, 0, 0.15);
      --accent-blue: #ff2222;
      --accent-blue-hover: #cc0000;
      --text-main: #ff6666;
      --text-muted: #990000;
      --success: #ff0000;
      --error: #ff3333;
      filter: saturate(0.9) contrast(1.1);
    }

    body.night-vision .logo-icon {
      background-color: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    body.night-vision .btn-publish {
      background: linear-gradient(135deg, #cc0000 0%, #660000 100%);
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    }

    body.night-vision .btn-publish:hover {
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
    }

    body.night-vision .toggle-visibility-btn {
      color: #990000;
    }

    body.night-vision .toggle-visibility-btn:hover {
      color: #ff6666;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.11.02-1.93 1.23-5.46 3.62-.51.35-.98.53-1.39.51-.46-.01-1.35-.26-2.01-.48-.81-.27-1.46-.42-1.4-.88.03-.24.36-.49.99-.75 3.88-1.69 6.46-2.8 7.74-3.32 3.68-1.5 4.44-1.76 4.94-1.77.11 0 .36.03.52.16.14.11.18.27.2.42-.01.12 0 .25-.01.37z"/>
        </svg>
      </div>
      <div>
        <h1>TG PUBLISHER</h1>
        <p>Панель публикатора каналов</p>
      </div>
    </div>
    <div style="font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.75rem; border-radius: 20px; border: 1px solid var(--border-color); background-color: var(--bg-secondary);">
      Property in Albania Setup
    </div>
  </header>

  <main>
    <!-- Left panel: Control Forms -->
    <section class="glass-panel">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" style="width: 1.2rem; height: 1.2rem; fill: currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        Параметры публикации
      </div>

      <!-- Credentials -->
      <div class="form-group">
        <label for="bot-token">Секретный токен бота (Bot Token)</label>
        <div class="input-wrapper">
          <input type="password" id="bot-token" placeholder="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ">
          <button type="button" class="toggle-visibility-btn" id="toggle-token-btn" title="Показать токен">
            <svg viewBox="0 0 24 24" style="width: 1.1rem; height: 1.1rem; fill: currentColor;">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="chat-id">ID чата / Ссылка на группу (Chat ID)</label>
        <input type="text" id="chat-id" value="@property_in_albania" placeholder="Например: @property_in_albania или -100123456789">
      </div>

      <div class="form-group checkbox-group" id="save-creds-wrapper">
        <input type="checkbox" id="save-credentials" checked>
        <label for="save-credentials" style="cursor: pointer; text-transform: none; font-weight: 500;">Запомнить учетные данные на этом компьютере</label>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 0.25rem 0;">

      <!-- Content -->
      <div class="form-group">
        <label for="post-image">Ссылка на изображение (Опционально)</label>
        <input type="url" id="post-image" placeholder="https://example.com/photo.jpg">
      </div>

      <div class="form-group">
        <label for="post-text">Текст публикации (Поддерживает Markdown)</label>
        <textarea id="post-text" placeholder="Введите ваш продающий текст здесь...&#10;Используйте:&#10;*жирный*&#10;_курсив_&#10;`код`&#10;[ссылка](http://example.com)"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="btn-text">Текст кнопки (CTA)</label>
          <input type="text" id="btn-text" value="📢 Подписаться на канал" placeholder="Например: 🏠 Подписаться">
        </div>
        <div class="form-group">
          <label for="btn-url">Ссылка на кнопке</label>
          <input type="url" id="btn-url" value="https://t.me/property_albania_sun" placeholder="https://t.me/...">
        </div>
      </div>

      <button type="button" id="publish-btn" class="btn-publish">
        <svg viewBox="0 0 24 24" style="width: 1.2rem; height: 1.2rem; fill: currentColor;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        Опубликовать в Telegram
      </button>
    </section>

    <!-- Right panel: Live Preview & System console -->
    <section class="preview-container">
      <div class="tg-phone-frame">
        <!-- Telegram mockup header -->
        <div class="tg-chat-header">
          <div class="tg-avatar" id="avatar-preview">PA</div>
          <div class="tg-chat-info">
            <h3 id="chat-title-preview">Property in Albania</h3>
            <p>канал, 8 участников</p>
          </div>
        </div>

        <!-- Message bubble area -->
        <div class="tg-chat-history">
          <!-- Main Bubble -->
          <div class="tg-message-bubble">
            <div class="tg-message-image" id="bubble-image"></div>
            <div class="tg-message-text" id="bubble-text">Ваш продающий текст поста...</div>
            <div class="tg-message-meta">
              <span id="meta-time">12:00</span>
              <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            </div>
          </div>

          <!-- Keyboard buttons underneath -->
          <div class="tg-inline-keyboard">
            <a class="tg-inline-button" id="keyboard-button-preview" target="_blank">📢 Подписаться на канал</a>
          </div>
        </div>
      </div>

      <!-- Logs -->
      <div class="form-group" style="gap: 0.35rem;">
        <label>Лог отправки (Статус API)</label>
        <div class="console-panel" id="console-output">
          <div class="console-log info">Инициализация панели... Ждем ввода данных.</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // DOM Elements
      const botTokenInput = document.getElementById('bot-token');
      const toggleTokenBtn = document.getElementById('toggle-token-btn');
      const chatIdInput = document.getElementById('chat-id');
      const saveCredsCheckbox = document.getElementById('save-credentials');
      
      const postImageInput = document.getElementById('post-image');
      const postTextInput = document.getElementById('post-text');
      const btnTextInput = document.getElementById('btn-text');
      const btnUrlInput = document.getElementById('btn-url');
      const publishBtn = document.getElementById('publish-btn');

      // Mockup elements
      const chatTitlePreview = document.getElementById('chat-title-preview');
      const avatarPreview = document.getElementById('avatar-preview');
      const bubbleImage = document.getElementById('bubble-image');
      const bubbleText = document.getElementById('bubble-text');
      const keyboardButtonPreview = document.getElementById('keyboard-button-preview');
      const metaTime = document.getElementById('meta-time');
      const consoleOutput = document.getElementById('console-output');

      // Night Vision inherit logic from main project if toggled
      if (window.parent && window.parent.document.body.classList.contains('night-vision')) {
        document.body.classList.add('night-vision');
      }

      // Load saved credentials
      loadSavedCredentials();

      // Event Listeners
      toggleTokenBtn.addEventListener('click', toggleTokenVisibility);
      
      [chatIdInput, postImageInput, postTextInput, btnTextInput, btnUrlInput].forEach(el => {
        el.addEventListener('input', updateLivePreview);
      });

      publishBtn.addEventListener('click', publishPostToTelegram);

      // Initial run
      updateLivePreview();
      setInterval(updatePreviewTime, 10000); // Keep preview time updated
      updatePreviewTime();

      // Functions
      function toggleTokenVisibility() {
        if (botTokenInput.type === 'password') {
          botTokenInput.type = 'text';
          toggleTokenBtn.style.color = 'var(--accent-blue)';
        } else {
          botTokenInput.type = 'password';
          toggleTokenBtn.style.color = '';
        }
      }

      function updatePreviewTime() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        metaTime.textContent = `${hh}:${mm}`;
      }

      // Robust Markdown-to-HTML parser protecting underscores in usernames/links
      function parseMarkdown(text, isForTelegram = false) {
        if (!text) return isForTelegram ? '' : 'Ваш продающий текст поста...';
        
        let html = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        // Bold: **text** or *text*
        html = html.replace(/(^|[^a-zA-Z0-9\\])\*\*(?=\S)(.*?)(?<=\S)\*\*(?![a-zA-Z0-9])/g, '$1<strong>$2</strong>');
        html = html.replace(/(^|[^a-zA-Z0-9\\])\*(?=\S)(.*?)(?<=\S)\*(?![a-zA-Z0-9])/g, '$1<strong>$2</strong>');
        
        // Italic: __text__ or _text_
        html = html.replace(/(^|[^a-zA-Z0-9\\])__(?=\S)(.*?)(?<=\S)__(?![a-zA-Z0-9])/g, '$1<em>$2</em>');
        html = html.replace(/(^|[^a-zA-Z0-9\\])_(?=\S)(.*?)(?<=\S)_(?![a-zA-Z0-9])/g, '$1<em>$2</em>');
        
        // Code: `code`
        html = html.replace(/`(.*?)`/g, '<code>$1</code>');
        
        // Links: [text](url)
        if (isForTelegram) {
          html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>');
        } else {
          html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
        }

        return html;
      }

      function updateLivePreview() {
        // Update Title & Avatar
        const chatIdVal = chatIdInput.value.trim();
        if (chatIdVal) {
          chatTitlePreview.textContent = chatIdVal;
          avatarPreview.textContent = chatIdVal.replace('@', '').slice(0, 2).toUpperCase();
        } else {
          chatTitlePreview.textContent = 'Property in Albania';
          avatarPreview.textContent = 'PA';
        }

        // Image preview
        const imgUrl = postImageInput.value.trim();
        if (imgUrl) {
          bubbleImage.style.backgroundImage = `url('${imgUrl}')`;
          bubbleImage.style.display = 'block';
        } else {
          bubbleImage.style.display = 'none';
        }

        // Text preview
        bubbleText.innerHTML = parseMarkdown(postTextInput.value);

        // Button preview
        const btnText = btnTextInput.value.trim();
        const btnUrl = btnUrlInput.value.trim();

        if (btnText && btnUrl) {
          keyboardButtonPreview.textContent = btnText;
          keyboardButtonPreview.href = btnUrl;
          keyboardButtonPreview.style.display = 'block';
        } else {
          keyboardButtonPreview.style.display = 'none';
        }
      }

      function logMessage(text, type = 'info') {
        const log = document.createElement('div');
        log.className = `console-log ${type}`;
        const time = new Date().toLocaleTimeString();
        log.textContent = `[${time}] ${text}`;
        consoleOutput.appendChild(log);
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      function saveCredentials() {
        if (saveCredsCheckbox.checked) {
          localStorage.setItem('tg_bot_token', botTokenInput.value.trim());
          localStorage.setItem('tg_chat_id', chatIdInput.value.trim());
        } else {
          localStorage.removeItem('tg_bot_token');
          localStorage.removeItem('tg_chat_id');
        }
      }

      function loadSavedCredentials() {
        const savedToken = localStorage.getItem('tg_bot_token');
        const savedChatId = localStorage.getItem('tg_chat_id');
        
        if (savedToken) botTokenInput.value = savedToken;
        if (savedChatId) chatIdInput.value = savedChatId;
      }

      async function publishPostToTelegram() {
        const token = botTokenInput.value.trim();
        const chatId = chatIdInput.value.trim();
        const text = postTextInput.value.trim();
        const imageUrl = postImageInput.value.trim();
        const btnText = btnTextInput.value.trim();
        const btnUrl = btnUrlInput.value.trim();

        if (!token) {
          logMessage('Ошибка: Не введен токен бота.', 'error');
          alert('Пожалуйста, введите токен вашего Telegram-бота.');
          return;
        }

        if (!chatId) {
          logMessage('Ошибка: Не введен ID чата/группы.', 'error');
          alert('Пожалуйста, укажите получателя (Chat ID).');
          return;
        }

        if (!text) {
          logMessage('Ошибка: Текст поста пуст.', 'error');
          alert('Напишите какой-нибудь текст для публикации.');
          return;
        }

        // Save credentials if checked
        saveCredentials();

        // Build keyboard
        let replyMarkup = null;
        if (btnText && btnUrl) {
          replyMarkup = {
            inline_keyboard: [[
              { text: btnText, url: btnUrl }
            ]]
          };
        }

        publishBtn.disabled = true;
        const originalBtnText = publishBtn.innerHTML;
        publishBtn.innerHTML = 'Отправка...';
        
        logMessage(`Запуск публикации в чат ${chatId}...`, 'info');

        try {
          let url = '';
          let payload = {
            chat_id: chatId,
            parse_mode: 'HTML'
          };

          if (replyMarkup) {
            payload.reply_markup = JSON.stringify(replyMarkup);
          }

          if (imageUrl) {
            // Photo message API
            url = `https://api.telegram.org/bot${token}/sendPhoto`;
            payload.photo = imageUrl;
            payload.caption = parseMarkdown(text, true);
          } else {
            // Text message API
            url = `https://api.telegram.org/bot${token}/sendMessage`;
            payload.text = parseMarkdown(text, true);
          }

          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (result.ok) {
            logMessage('Пост успешно опубликован в Telegram!', 'success');
            alert('Пост успешно опубликован!');
          } else {
            logMessage(`Ошибка API Telegram: ${result.description} (Код: ${result.error_code})`, 'error');
            alert(`Ошибка при отправке: ${result.description}`);
          }

        } catch (error) {
          logMessage(`Ошибка сети: не удалось связаться с сервером Telegram. (${error.message})`, 'error');
          alert(`Ошибка сети: ${error.message}`);
        } finally {
          publishBtn.disabled = false;
          publishBtn.innerHTML = originalBtnText;
        }
      }
    });
  </script>
</body>
</html>
